name: CI Lint and Build
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check project and build
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run lint --if-present
            npm run build --if-present
          else
            echo "Chưa có package.json (đang chờ code Frontend), bỏ qua bước build."
          fi